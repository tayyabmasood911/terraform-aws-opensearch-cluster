<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="70" y="60" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="0.3">AWS OpenSearch Multi-AZ Production Cluster Architecture</text>
  <rect x="910" y="40" width="110" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="925" y="58" fill="#047857" font-size="12" font-weight="600">PRODUCTION</text>
  <rect x="1030" y="40" width="100" height="26" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1045" y="58" fill="#1d4ed8" font-size="12" font-weight="600">TERRAFORM</text>

  <!-- COLUMN 1: Search & Log Ingestion -->
  <rect x="40" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="40" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="60" y="136" fill="#0284c7" font-size="13" font-weight="700">1. CLIENTS &amp; INGESTION</text>

  <rect x="60" y="170" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="198" fill="#0f172a" font-size="14" font-weight="600">Application Microservices</text>
  <text x="75" y="222" fill="#64748b" font-size="11">Elastic Full-Text Search Queries</text>

  <rect x="60" y="260" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="288" fill="#0f172a" font-size="14" font-weight="600">Logstash &amp; Fluentbit</text>
  <text x="75" y="312" fill="#64748b" font-size="11">Log Aggregation &amp; Indexing</text>

  <rect x="60" y="350" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="378" fill="#0f172a" font-size="14" font-weight="600">OpenSearch Dashboards</text>
  <text x="75" y="402" fill="#64748b" font-size="11">Visual Search &amp; Log Explorer</text>

  <rect x="60" y="440" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="468" fill="#0f172a" font-size="14" font-weight="600">OpenTelemetry Collector</text>
  <text x="75" y="492" fill="#64748b" font-size="11">Trace Analytics Pipeline</text>

  <!-- COLUMN 2: VPC Network Security -->
  <rect x="330" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="330" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="350" y="136" fill="#6366f1" font-size="13" font-weight="700">2. VPC ACCESS BOUNDARY</text>

  <rect x="350" y="170" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="365" y="198" fill="#0f172a" font-size="14" font-weight="600">VPC Endpoint (ENIs)</text>
  <text x="365" y="222" fill="#64748b" font-size="11">3 Private Subnets across AZs</text>

  <rect x="350" y="260" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="365" y="288" fill="#0f172a" font-size="14" font-weight="600">Restricted Security Group</text>
  <text x="365" y="312" fill="#64748b" font-size="11">Port 443 Ingress Only</text>

  <rect x="350" y="350" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="365" y="378" fill="#0f172a" font-size="14" font-weight="600">Fine-Grained Access</text>
  <text x="365" y="402" fill="#64748b" font-size="11">Document &amp; Field-Level RBAC</text>

  <rect x="350" y="440" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="365" y="468" fill="#0f172a" font-size="14" font-weight="600">Enforced TLS 1.2 Policy</text>
  <text x="365" y="492" fill="#64748b" font-size="11">Policy-Min-TLS-1-2-2019-07</text>

  <!-- COLUMN 3: OpenSearch Cluster Nodes -->
  <rect x="620" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="620" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="640" y="136" fill="#d97706" font-size="13" font-weight="700">3. MULTI-AZ NODES</text>

  <rect x="640" y="170" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="655" y="198" fill="#0f172a" font-size="14" font-weight="600">3x Dedicated Masters</text>
  <text x="655" y="222" fill="#64748b" font-size="11">Split-Brain Proof Cluster Quorum</text>

  <rect x="640" y="260" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="655" y="288" fill="#0f172a" font-size="14" font-weight="600">3x Data Nodes (r6g.large)</text>
  <text x="655" y="312" fill="#64748b" font-size="11">Graviton2 Memory-Optimized</text>

  <rect x="640" y="350" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="655" y="378" fill="#0f172a" font-size="14" font-weight="600">Node-to-Node Encryption</text>
  <text x="655" y="402" fill="#64748b" font-size="11">Internal Inter-Cluster TLS</text>

  <rect x="640" y="440" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="655" y="468" fill="#0f172a" font-size="14" font-weight="600">GP3 EBS Volumes (KMS)</text>
  <text x="655" y="492" fill="#64748b" font-size="11">3000 IOPS / 125 MB/s Burst</text>

  <!-- COLUMN 4: Lifecycle & Observability -->
  <rect x="910" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="910" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="930" y="136" fill="#059669" font-size="13" font-weight="700">4. OPERATIONS &amp; ISM</text>

  <rect x="930" y="170" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="945" y="198" fill="#0f172a" font-size="14" font-weight="600">Index State Management</text>
  <text x="945" y="222" fill="#64748b" font-size="11">Hot-to-Warm Tier Rollover</text>

  <rect x="930" y="260" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="945" y="288" fill="#0f172a" font-size="14" font-weight="600">CloudWatch Slow Logs</text>
  <text x="945" y="312" fill="#64748b" font-size="11">Search &amp; Indexing Diagnostics</text>

  <rect x="930" y="350" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="945" y="378" fill="#0f172a" font-size="14" font-weight="600">CloudWatch App Logs</text>
  <text x="945" y="402" fill="#64748b" font-size="11">Cluster Health &amp; Garbage Collection</text>

  <rect x="930" y="440" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="945" y="468" fill="#0f172a" font-size="14" font-weight="600">Automated S3 Snapshots</text>
  <text x="945" y="492" fill="#64748b" font-size="11">Hourly Point-in-Time Recovery</text>

  <!-- Connectors -->
  <path d="M 290 205 L 330 205" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 580 205 L 620 205" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 870 205 L 910 205" stroke="#94a3b8" stroke-width="2"/>

  <path d="M 290 385 L 330 385" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 580 385 L 620 385" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 870 385 L 910 385" stroke="#94a3b8" stroke-width="2"/>
</svg>
